name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - apply_gainmap
          - decode
          - parse_iso21496
          - parse_jpeg_segments
          - parse_mpf
          - parse_xmp
          - tonemap
    steps:
      - uses: actions/checkout@v6
      - name: Clone sibling zentone (required by ultrahdr-core default features)
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone
      - name: Clone sibling zenjpeg (path-dep during pre-0.5 cascade coordination)
        run: git clone --depth 1 https://github.com/imazen/zenjpeg.git ../zenjpeg
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          cache-directories: fuzz/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Determine duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/regression/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp fuzz/seed_corpus/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=${{ steps.duration.outputs.seconds }} \
               -dict=fuzz/ultrahdr.dict \
               -rss_limit_mb=2048

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30

  regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone sibling zentone (required by ultrahdr-core default features)
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone
      - name: Clone sibling zenjpeg (path-dep during pre-0.5 cascade coordination)
        run: git clone --depth 1 https://github.com/imazen/zenjpeg.git ../zenjpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # Hard gate. Until 2026-08-29 this step read:
      #
      #   if [ -d fuzz/regression ] && [ "$(ls fuzz/regression/ | wc -l)" -gt 0 ]; then
      #     cargo test --test fuzz_regression 2>/dev/null || echo "No regression test found..."
      #   fi
      #
      # which could not fail: `|| echo` swallowed the exit status, `2>/dev/null`
      # hid the reason, and the `if` skipped the whole thing when the corpus went
      # missing. Here the fallback's own message was literally true — there was no
      # `tests/fuzz_regression.rs` in the repo at all — so this job reported green
      # over a target that did not exist and the two committed seeds were never
      # replayed. The harness now lives in `ultrahdr-rs/tests/fuzz_regression.rs`
      # and covers all seven fuzz targets. Do not reintroduce a fallback: if the
      # suite cannot run, this job must go red.
      - name: Regression seeds
        run: cargo test --test fuzz_regression
