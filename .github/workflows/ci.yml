name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Public-API snapshot regen (ultrahdr-core/tests/public_api_doc.rs) needs
  # nightly rustdoc + cargo-public-api; only the api-doc job carries them
  # and runs the check.
  ZEN_API_DOC: off

jobs:
  # Public-API surface snapshots (docs/public-api/*.txt) must match the
  # committed code. Needs the FULL workspace (ultrahdr-rs included), so the
  # sibling path-deps are cloned like ffi-tests.yml does — no workspace strip.
  api-doc:
    name: Public-API snapshot check
    runs-on: ubuntu-latest
    env:
      # Sibling clones (zenjpeg/zenanalyze/zentone main) are built as deps of
      # the rustdoc pass; don't gate this check on THEIR warning hygiene.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - name: Clone sibling zentone (required by ultrahdr-core default features)
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone
      - name: Clone sibling zenjpeg (path-dep during pre-0.5 cascade coordination)
        run: git clone --depth 1 https://github.com/imazen/zenjpeg.git ../zenjpeg
      - name: Clone sibling zenanalyze (transitive path-dep of zenjpeg)
        run: git clone --depth 1 https://github.com/imazen/zenanalyze.git ../zenanalyze
      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for cargo-public-api
      - uses: dtolnay/rust-toolchain@stable # restore stable as default
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Public-API snapshot is current
        run: cargo test -p ultrahdr-core --test public_api_doc
        env:
          ZEN_API_DOC: check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-26-intel
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: |
          sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p ultrahdr-core --all-targets

      - name: Run tests
        run: cargo test -p ultrahdr-core --all-targets

      - name: Test with simd feature
        run: cargo test -p ultrahdr-core --all-targets --features simd

      - name: Build without zentone (leaner decoder-path config)
        run: cargo build -p ultrahdr-core --no-default-features --features "std"

      - name: Test without zentone (leaner decoder-path config)
        run: cargo test -p ultrahdr-core --no-default-features --features "std"

      - name: Check ultrahdr-core no_std (no default features)
        run: cargo build --package ultrahdr-core --no-default-features

      - name: Run clippy
        run: cargo clippy -p ultrahdr-core --all-targets -- -D warnings

      - name: Clippy without zentone
        run: cargo clippy -p ultrahdr-core --no-default-features --features "std" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt


      - name: Check formatting
        run: cargo fmt --package ultrahdr-core --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Check ultrahdr-core WASM build
        run: cargo build --package ultrahdr-core --target wasm32-unknown-unknown

      - name: Check ultrahdr-core WASM (no default features)
        run: cargo build --package ultrahdr-core --target wasm32-unknown-unknown --no-default-features

      - name: Build WASI benchmark
        run: RUSTFLAGS="--cap-lints warn" cargo build --package wasm-bench --target wasm32-wasip1 --release

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run WASI benchmark (smoke test)
        run: wasmtime target/wasm32-wasip1/release/wasm-bench.wasm

      - name: Report WASM binary size
        run: |
          ls -lh target/wasm32-wasip1/release/wasm-bench.wasm
          echo "WASM_SIZE=$(stat -c%s target/wasm32-wasip1/release/wasm-bench.wasm)" >> $GITHUB_ENV

  wasm-test:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Run WASM tests
        run: wasm-pack test --node ultrahdr
        continue-on-error: true  # WASM tests may need browser environment

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Check docs
        run: cargo doc -p ultrahdr-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Generate coverage
        run: cargo llvm-cov -p ultrahdr-core --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Strip workspace members needing sibling repos
        shell: bash
        run: sed -i.bak -e '/"ultrahdr-rs"/d' -e '/"wasm-bench"/d' -e '/^zenjpeg/d' Cargo.toml && rm -f Cargo.lock

      - name: Clone sibling zentone (required by ultrahdr-core default features)
        shell: bash
        run: git clone --depth 1 https://github.com/imazen/zentone.git ../zentone

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@1.92

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Check MSRV
        run: cargo check -p ultrahdr-core
