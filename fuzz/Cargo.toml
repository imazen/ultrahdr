[package]
name = "ultrahdr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
zenpixels = { version = "0.5.0", default-features = false }

[dependencies.ultrahdr-core]
path = "../ultrahdr-core"
default-features = false
features = ["std"]

[dependencies.ultrahdr-rs]
path = "../ultrahdr-rs"

[dependencies.zenjpeg]
git = "https://github.com/imazen/zenjpeg"
rev = "e58c3d57b03409233cc3c165b6dc7849ee5081c8"

[dependencies.zencodec]
version = ">=0.3.0, <0.5.0"

# Prevent this from interfering with workspace resolution
[workspace]
members = ["."]

# Standalone workspace: keep the integration pins in sync with the root.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "0dd7af2a00d7ec4e573d80b764d323467c61cb5d" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "0dd7af2a00d7ec4e573d80b764d323467c61cb5d" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
ultrahdr-core = { path = "../ultrahdr-core" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "06298db38616157ae287471a86ec5f071e4b47c3" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "06298db38616157ae287471a86ec5f071e4b47c3" }

[profile.release]
debug = true
opt-level = 3

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
doc = false

[[bin]]
name = "parse_xmp"
path = "fuzz_targets/parse_xmp.rs"
doc = false

[[bin]]
name = "parse_iso21496"
path = "fuzz_targets/parse_iso21496.rs"
doc = false

[[bin]]
name = "parse_mpf"
path = "fuzz_targets/parse_mpf.rs"
doc = false

[[bin]]
name = "parse_jpeg_segments"
path = "fuzz_targets/parse_jpeg_segments.rs"
doc = false

[[bin]]
name = "apply_gainmap"
path = "fuzz_targets/apply_gainmap.rs"
doc = false

[[bin]]
name = "tonemap"
path = "fuzz_targets/tonemap.rs"
doc = false

# No direct `zentone` dependency and no `[patch.crates-io]` for it here (#32):
# ultrahdr-core requires registry `zentone = "0.1.0"`, and the sibling
# checkout is 0.2.0, so a path patch can never satisfy that requirement —
# cargo silently ignored it and the direct path dep pulled in a SECOND zentone
# whose `ToneMap` trait didn't apply to ultrahdr-core's types. The tonemap
# target imports `ToneMap` through ultrahdr-core's re-export instead, so it
# always sees the one zentone ultrahdr-core was built against.
