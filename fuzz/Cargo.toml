[package]
name = "ultrahdr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ultrahdr-core]
path = "../ultrahdr-core"
default-features = false
features = ["std"]

[dependencies.ultrahdr-rs]
path = "../ultrahdr-rs"

[dependencies.zentone]
path = "../../zentone"
default-features = false

[dependencies.zenjpeg]
path = "../../zenjpeg/zenjpeg"

[dependencies.zencodec]
version = "0.1.13"

# Prevent this from interfering with workspace resolution
[workspace]
members = ["."]

[profile.release]
debug = true
opt-level = 3

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
doc = false

[[bin]]
name = "parse_xmp"
path = "fuzz_targets/parse_xmp.rs"
doc = false

[[bin]]
name = "parse_iso21496"
path = "fuzz_targets/parse_iso21496.rs"
doc = false

[[bin]]
name = "parse_mpf"
path = "fuzz_targets/parse_mpf.rs"
doc = false

[[bin]]
name = "parse_jpeg_segments"
path = "fuzz_targets/parse_jpeg_segments.rs"
doc = false

[[bin]]
name = "apply_gainmap"
path = "fuzz_targets/apply_gainmap.rs"
doc = false

[[bin]]
name = "tonemap"
path = "fuzz_targets/tonemap.rs"
doc = false

# Same rationale as the workspace-root patch (this fuzz dir is its own
# workspace, so it doesn't inherit that one): ultrahdr-core's zentone dep is
# registry-only for git consumability; local/CI fuzz builds must resolve it
# to the sibling checkout, which carries not-yet-published zentone API the
# tonemap target exercises.
[patch.crates-io]
zentone = { path = "../../zentone" }
