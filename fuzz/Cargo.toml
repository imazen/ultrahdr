[package]
name = "ultrahdr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ultrahdr-core]
path = "../ultrahdr-core"
default-features = false
features = ["std"]

[dependencies.ultrahdr-rs]
path = "../ultrahdr-rs"

[dependencies.zenjpeg]
path = "../../zenjpeg/zenjpeg"

[dependencies.zencodec]
version = ">=0.1.26, <0.3.0"

# Prevent this from interfering with workspace resolution
[workspace]
members = ["."]

# This is its OWN workspace, so it does not inherit the root manifest's
# `[patch.crates-io]` — the same entry has to be repeated here. The sibling
# `zenjpeg` path dep takes `zenanalyze = "0.2.0"` from the registry and
# supplies the unpublished 0.2.x line through zenjpeg's own patch table, which
# is ignored once zenjpeg is consumed as a path dep. Without this, every fuzz
# target fails to build with `failed to select a version for the requirement
# zenanalyze = "^0.2.0"` (crates.io latest is 0.1.0). Drop when zenanalyze
# 0.2.0 publishes; keep in step with the root manifest.
[patch.crates-io]
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }

[profile.release]
debug = true
opt-level = 3

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
doc = false

[[bin]]
name = "parse_xmp"
path = "fuzz_targets/parse_xmp.rs"
doc = false

[[bin]]
name = "parse_iso21496"
path = "fuzz_targets/parse_iso21496.rs"
doc = false

[[bin]]
name = "parse_mpf"
path = "fuzz_targets/parse_mpf.rs"
doc = false

[[bin]]
name = "parse_jpeg_segments"
path = "fuzz_targets/parse_jpeg_segments.rs"
doc = false

[[bin]]
name = "apply_gainmap"
path = "fuzz_targets/apply_gainmap.rs"
doc = false

[[bin]]
name = "tonemap"
path = "fuzz_targets/tonemap.rs"
doc = false

# No direct `zentone` dependency and no `[patch.crates-io]` for it here (#32):
# ultrahdr-core requires registry `zentone = "0.1.0"`, and the sibling
# checkout is 0.2.0, so a path patch can never satisfy that requirement —
# cargo silently ignored it and the direct path dep pulled in a SECOND zentone
# whose `ToneMap` trait didn't apply to ultrahdr-core's types. The tonemap
# target imports `ToneMap` through ultrahdr-core's re-export instead, so it
# always sees the one zentone ultrahdr-core was built against.
