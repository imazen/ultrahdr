[package]
name = "ultrahdr-core"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Core gain map math and metadata for Ultra HDR - no codec dependencies"
repository = "https://github.com/imazen/ultrahdr"
keywords = ["hdr", "gainmap", "ultrahdr", "image", "no_std"]
categories = ["multimedia::images", "encoding", "no-std"]
readme = "../README.md"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
    "tests/",
    "benches/",
]

[dependencies]
# Cooperative cancellation
enough = "0.4"

# Math
wide = "1.1"
half = "2.7"

# SIMD (optional - for explicit SIMD optimizations)
archmage = { version = "0.9.16", default-features = false, features = ["macros"], optional = true }
magetypes = { version = "0.9.16", default-features = false, optional = true }

# Types
bytemuck = { version = "1.14", features = ["derive"] }

# Error handling - std only for now
thiserror = "2.0"

# Transfer functions (sRGB, PQ, HLG) — mandatory. These are load-bearing
# for every meaningful gain map path; the old `transfer` feature flag was
# removed in favour of always pulling linear-srgb.
linear-srgb = { version = "0.6.12", default-features = false, features = ["transfer"] }

# Zen ecosystem types (mandatory — canonical gain map metadata types)
zenpixels = { workspace = true }
zencodec = { workspace = true }

# Advanced tone mapping curves + the luma gain map splitter. Optional:
# the splitter API (LumaGainMapSplitter + curves) lives here, and ultrahdr-core
# re-exports it for back-compat. ultrahdr-core also re-exports BT.2408 /
# BT.2446 / filmic spline / AdaptiveTonemapper / StreamingTonemapper. Gated
# behind the `tonemap` feature (default-on) so decoder-only consumers can
# build with `--no-default-features --features std` and drop the transitive
# zentone dependency.
# Registry dep so the repo is consumable as a git dependency (an in-manifest
# path that escapes the repo breaks `git = ...` consumers). Local lockstep
# development against the sibling checkout comes from the workspace-root
# `[patch.crates-io]` instead — same layout, same behavior.
zentone = { version = "0.1.0", default-features = false, features = ["experimental"], optional = true }

# High-quality gain map resampling (optional)
zenresize = { workspace = true, optional = true }

# Native-only: proptest uses rusty-fork/wait-timeout (no wasm32 support)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.10"
criterion = "0.8"

[[bench]]
name = "gainmap"
harness = false

[[bench]]
name = "simd_xplat"
harness = false
required-features = ["simd"]

[features]
default = ["std", "tonemap"]
std = ["enough/std", "archmage?/std", "magetypes?/std", "linear-srgb/std", "zentone?/std"]
# Gates the zentone-backed re-exports (LumaToneMap, LumaGainMapSplitter,
# Bt2408Yrgb, HableFilmic, ExtendedReinhardLuma, LumaFn, SplitConfig,
# SplitStats) at the crate root, plus the `color::tonemap` and
# `color::streaming_tonemap` modules. Default-on; turn off with
# `--no-default-features --features std` to drop the transitive zentone dep.
tonemap = ["dep:zentone"]
simd = ["archmage", "magetypes"]  # Enable explicit SIMD optimizations
resize = ["dep:zenresize"]  # High-quality gain map downsampling via zenresize.
# Future: alloc-only support
# alloc = ["enough/alloc"]
