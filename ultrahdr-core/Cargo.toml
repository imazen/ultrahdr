[package]
name = "ultrahdr-core"
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Core gain map math and metadata for Ultra HDR - no codec dependencies"
repository = "https://github.com/imazen/ultrahdr"
keywords = ["hdr", "gainmap", "ultrahdr", "image", "no_std"]
categories = ["multimedia::images", "encoding", "no-std"]
readme = "../README.md"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[dependencies]
# Cooperative cancellation
enough = "0.4"

# Math
wide = "1.1"
half = "2.7"

# SIMD (optional - for explicit SIMD optimizations)
archmage = { version = "0.9.16", default-features = false, features = ["macros"], optional = true }
magetypes = { version = "0.9.16", default-features = false, optional = true }

# Types
bytemuck = { version = "1.14", features = ["derive"] }

# Error handling - std only for now
thiserror = "2.0"

# Transfer functions (optional)
linear-srgb = { version = "0.6.7", optional = true, features = ["transfer"] }

# Zen ecosystem types (mandatory — canonical gain map metadata types)
zenpixels = { workspace = true }
zencodec = { workspace = true }

# Advanced tone mapping curves (optional, default-on via the `zentone` feature).
# Without this feature ultrahdr-core still provides a built-in Hable filmic
# splitter, which is enough to reduce HDR to (SDR, luma gain) and apply gain
# maps. With the feature, callers get BT.2408 / BT.2446 / filmic spline /
# AdaptiveTonemapper / StreamingTonemapper re-exported from zentone.
zentone = { path = "../../zentone", default-features = false, features = ["experimental"], optional = true }

# High-quality gain map resampling (optional)
zenresize = { workspace = true, optional = true }

[dev-dependencies]

# Native-only: proptest uses rusty-fork/wait-timeout (no wasm32 support)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.10"
criterion = "0.8"

[[bench]]
name = "gainmap"
harness = false

[[bench]]
name = "simd_xplat"
harness = false
required-features = ["simd"]

[features]
default = ["std", "transfer", "zentone"]
std = ["enough/std", "archmage?/std", "magetypes?/std", "linear-srgb?/std", "zentone?/std"]
simd = ["archmage", "magetypes"]  # Enable explicit SIMD optimizations
transfer = ["dep:linear-srgb"]  # Transfer functions (sRGB, PQ, HLG) via linear-srgb.
resize = ["dep:zenresize"]  # High-quality gain map downsampling via zenresize.
# Advanced tone mapping curves + streaming tonemapper via the zentone crate.
# Default-on; disable for a leaner build when only the in-core Hable filmic
# splitter is needed (decoders integrating ultrahdr-core often want this).
zentone = ["dep:zentone"]
# Future: alloc-only support
# alloc = ["enough/alloc"]
