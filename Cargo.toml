[workspace]
resolver = "2"
members = [
    "ultrahdr-core",
    "ultrahdr",
    "wasm-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/imazen/ultrahdr"

[workspace.dependencies]
# Core crate
ultrahdr-core = { path = "ultrahdr-core", version = "0.2.0" }

# Cooperative cancellation
enough = "0.4"

# Math
wide = "1.1"
half = "2.7"

# Types
bytemuck = { version = "1.14", features = ["derive"] }

# Error handling
thiserror = "2.0"

# JPEG codec
zenjpeg = { path = "../zenjpeg/zenjpeg", features = ["decoder"] }

# Color management
moxcms = "0.8"

# Image buffer abstractions
imgref = "1.12"
rgb = { version = "0.8", features = ["as-bytes"] }

# Testing
proptest = "1.10"
fast-ssim2 = "0.7"
criterion = "0.8"
