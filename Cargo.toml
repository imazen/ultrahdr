[workspace]
resolver = "2"
members = [
    "ultrahdr-core",
    "ultrahdr-rs",
    "wasm-bench",
]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/imazen/ultrahdr"

[workspace.dependencies]
# Core crate
ultrahdr-core = { path = "ultrahdr-core", version = "0.4.1" }

# Cooperative cancellation
enough = "0.4"

# Math
wide = "1.1"
half = "2.7"

# Types
bytemuck = { version = "1.14", features = ["derive"] }

# Error handling
thiserror = "2.0"

# JPEG codec — sibling path while we evolve zenjpeg main and ultrahdr in
# lockstep toward the zentone→ultrahdr-core→zenjpeg→ultrahdr-rs release
# cascade. CI workflows clone `imazen/zenjpeg` into `../zenjpeg` alongside
# this repo (same pattern as zentone). The `version` hint is advisory for
# downstream tooling; the path wins locally. Kept on ONE line so
# `ci.yml`'s `sed '/^zenjpeg/d' Cargo.toml` correctly strips it for the
# ultrahdr-core-only standalone jobs.
zenjpeg = { path = "../zenjpeg/zenjpeg", version = "0.8", features = ["decoder"] }

# Color management
moxcms = "0.8.1"

# Image buffer abstractions
imgref = "1.12"
rgb = { version = "0.8", features = ["as-bytes"] }

# Transfer functions
linear-srgb = { version = "0.6.7", default-features = false, features = ["transfer"] }

# Zen ecosystem interop
# zenpixels 0.2.11 adds RgbaF16/RgbF16 needed for HdrOutputFormat::LinearF16;
# follows the zenjpeg sibling-path pattern until 0.2.11 publishes.
zenpixels = { path = "../zenpixels/zenpixels", version = "0.2.11", default-features = false }
zencodec = { version = "0.1.13" }
zenresize = { version = "0.2.2", default-features = false }

# Testing
proptest = "1.10"
fast-ssim2 = "0.7"
criterion = "0.8"


[patch.crates-io]
# Sibling-path pin for in-flight zenpixels 0.2.11 (RgbaF16/RgbF16 + new packed
# formats in garb). zenjpeg's local checkout transitively requires
# zenpixels-convert 0.2.11 which isn't published yet; without this patch
# cargo can't resolve. Drop both lines once 0.2.11 hits crates.io.
zenpixels = { path = "../zenpixels/zenpixels" }
zenpixels-convert = { path = "../zenpixels/zenpixels-convert" }
