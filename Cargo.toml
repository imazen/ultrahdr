[workspace]
resolver = "2"
members = [
    "ultrahdr-core",
    "ultrahdr-rs",
    "wasm-bench",
]
# The public-API snapshot runner (depends on zenutils-apidoc) is NOT a
# workspace member: plain `cargo test` and CI never build it. Regenerate
# via `just api-doc` (= `cargo test --manifest-path apidoc/Cargo.toml`).
exclude = ["apidoc"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/imazen/ultrahdr"

[workspace.dependencies]
# Core crate
ultrahdr-core = { path = "ultrahdr-core", version = "0.6.0" }

# Cooperative cancellation
enough = "0.4"

# Math — f16 conversion. Opt-in via ultrahdr-core's `f16` feature; in
# ultrahdr-rs it is test-only (libultrahdr pixel-parity comparison).
half = "2.7"

# Types
bytemuck = { version = "1.14", features = ["derive"] }

# Error handling
thiserror = "2.0"

# JPEG codec — sibling path while we evolve zenjpeg main and ultrahdr in
# lockstep toward the zentone→ultrahdr-core→zenjpeg→ultrahdr-rs release
# cascade. CI workflows clone `imazen/zenjpeg` into `../zenjpeg` alongside
# this repo (same pattern as zentone). The `version` hint is advisory for
# downstream tooling; the path wins locally. Kept on ONE line so
# `ci.yml`'s `sed '/^zenjpeg/d' Cargo.toml` correctly strips it for the
# ultrahdr-core-only standalone jobs.
zenjpeg = { path = "../zenjpeg/zenjpeg", version = "0.9.0", features = ["decoder"] }

# Color management
moxcms = ">=0.8.1, <0.10"

# Image buffer abstractions
imgref = "1.12"
rgb = { version = "0.8", features = ["as-bytes"] }

# Transfer functions
linear-srgb = { version = "0.6.12", default-features = false, features = ["transfer"] }

# Zen ecosystem interop
zenpixels = { version = "0.2.14", default-features = false }
zencodec = { version = "0.1.23" }
zenresize = { version = "0.2.2", default-features = false }

# Testing
proptest = "1.10"
fast-ssim2 = "0.7"
criterion = "0.8"

# Local lockstep development: build against the sibling zentone checkout
# (zentone -> ultrahdr-core release cascade) without putting an out-of-repo
# path in ultrahdr-core's own manifest, which would break consumers that
# depend on ultrahdr-core via `git = "https://github.com/imazen/ultrahdr"`.
# CI clones ../zentone alongside this repo; registry builds (cargo publish,
# git consumers) ignore this section entirely. Same pattern for
# zenpixels-convert: the BT.2446A re-export needs a published 0.2.15
# (queued); this patch points at the sibling checkout where the audited
# `Bt2446A` lives now. Drop the patch once the registry release lands.
[patch.crates-io]
zentone = { path = "../zentone" }
# zenpixels-convert + zenpixels: pinned at the clean
# imazen/zenpixels@69bb400a (deprecate(hdr) commit) where the audited
# `Bt2446A` re-exports + the 0.2.15 ContentLightLevel surface live.
# Switch to a registry version pin once 0.2.15 ships to crates.io.
# Git-pinning (not a sibling path) lets concurrent sessions edit the
# sibling worktree without breaking this build.
zenpixels-convert = { git = "https://github.com/imazen/zenpixels.git", rev = "69bb400a99d489aac4c62fc82920a6a70272b59c" }
zenpixels = { git = "https://github.com/imazen/zenpixels.git", rev = "69bb400a99d489aac4c62fc82920a6a70272b59c" }
# TEMP: until zencodec 0.1.26 ships (PR #103 — CategorizedError taxonomy).
# zenjpeg 0.9 (Pattern-B) compiles only against this; pinned to the SAME rev
# as zenjpeg's own workspace patch so both resolve one zencodec. Drop for the
# crates.io version once zencodec 0.1.26 publishes.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "c3220d51d2ef8ec16e8328ada2d5a04c7e6750ee" }
