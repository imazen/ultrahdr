[workspace]
resolver = "2"
members = [
    "ultrahdr-core",
    "ultrahdr-rs",
    "wasm-bench",
]
# The public-API snapshot runner (depends on zenutils-apidoc) is NOT a
# workspace member: plain `cargo test` and CI never build it. Regenerate
# via `just api-doc` (= `cargo test --manifest-path apidoc/Cargo.toml`).
exclude = ["apidoc"]

[workspace.package]
# NOTE: 0.4.0 was already published+yanked once (2026-04-10, mistaken minor
# bump with no real break, corrected to 0.3.5 same day) AND separately
# pre-bumped again here for a second, genuine breaking-change batch
# (CHANGELOG "[0.4.0] - 2026-06-23") that was never actually published.
# crates.io permanently burns yanked version numbers, so this real release
# ships as 0.4.1 instead of reusing 0.4.0.
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/imazen/ultrahdr"

[workspace.dependencies]
# Core crate
ultrahdr-core = { path = "ultrahdr-core", version = "0.6.0" }

# Cooperative cancellation
enough = "0.4.5"

# Math — f16 conversion. Opt-in via ultrahdr-core's `f16` feature; in
# ultrahdr-rs it is test-only (libultrahdr pixel-parity comparison).
half = "2.7.1"

# Types
bytemuck = { version = "1.25.2", features = ["derive"] }

# Error handling
thiserror = "2.0.21"

# Pin the codec while the metadata stack is integrated across repositories.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "e58c3d57b03409233cc3c165b6dc7849ee5081c8", version = "0.9.0" }

# Color management
moxcms = ">=0.8.1, <0.10"

# Image buffer abstractions
imgref = "1.12.3"
rgb = { version = "0.8.53", features = ["as-bytes"] }

# Transfer functions
linear-srgb = { version = "0.6.13", default-features = false, features = ["transfer"] }

# Zen ecosystem interop
zenpixels = { version = "0.5.0", default-features = false }
zencodec = { version = ">=0.3.0, <0.5.0" }
zenresize = { version = ">=0.3.1, <0.4.0", default-features = false }

# Testing
proptest = "1.11.0"
fast-ssim2 = "0.7"
criterion = "0.8.2"

[patch.crates-io]
zenresize = { git = "https://github.com/imazen/zenresize", rev = "e3975fb9d6d6b7baa96038a0eb8e27febb37c012" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "0dd7af2a00d7ec4e573d80b764d323467c61cb5d" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "0dd7af2a00d7ec4e573d80b764d323467c61cb5d" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
# The optional resize dependency still requests the 0.3 pixel family.
zenpixels-03 = { package = "zenpixels", git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
ultrahdr-core = { path = "ultrahdr-core" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "06298db38616157ae287471a86ec5f071e4b47c3" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "06298db38616157ae287471a86ec5f071e4b47c3" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "06298db38616157ae287471a86ec5f071e4b47c3" }
