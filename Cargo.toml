[workspace]
resolver = "2"
members = [
    "ultrahdr-core",
    "ultrahdr-rs",
    "wasm-bench",
]
# The public-API snapshot runner (depends on zenutils-apidoc) is NOT a
# workspace member: plain `cargo test` and CI never build it. Regenerate
# via `just api-doc` (= `cargo test --manifest-path apidoc/Cargo.toml`).
exclude = ["apidoc"]

[workspace.package]
# NOTE: 0.4.0 was already published+yanked once (2026-04-10, mistaken minor
# bump with no real break, corrected to 0.3.5 same day) AND separately
# pre-bumped again here for a second, genuine breaking-change batch
# (CHANGELOG "[0.4.0] - 2026-06-23") that was never actually published.
# crates.io permanently burns yanked version numbers, so this real release
# ships as 0.4.1 instead of reusing 0.4.0.
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/imazen/ultrahdr"

[workspace.dependencies]
# Core crate
ultrahdr-core = { path = "ultrahdr-core", version = "0.6.0" }

# Cooperative cancellation
enough = "0.4"

# Math — f16 conversion. Opt-in via ultrahdr-core's `f16` feature; in
# ultrahdr-rs it is test-only (libultrahdr pixel-parity comparison).
half = "2.7.1"

# Types
bytemuck = { version = "1.25.2", features = ["derive"] }

# Error handling
thiserror = "2.0.20"

# Pin the codec while the metadata stack is integrated across repositories.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4196fa93d422bc367d1e3ddadbaddfe672b9cdfc", version = "0.9.0" }

# Color management
moxcms = ">=0.8.1, <0.10"

# Image buffer abstractions
imgref = "1.12.3"
rgb = { version = "0.8.53", features = ["as-bytes"] }

# Transfer functions
linear-srgb = { version = "0.6.12", default-features = false, features = ["transfer"] }

# Zen ecosystem interop
zenpixels = { version = ">=0.2.14, <0.4.0", default-features = false }
# zencodec 0.2 family revision (ideal-api f5a7fd46). crates.io ultrahdr-core 0.6.0
# requires zencodec ^0.1, so 0.2 consumers patch ultrahdr-core to this revision.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f5a7fd46231048a7290f11df5b32e010a3e529a8", version = ">=0.1.26, <0.3.0" }
zenresize = { version = "0.2.2", default-features = false }

# Testing
proptest = "1.11.0"
fast-ssim2 = "0.7"
criterion = "0.8.2"

[patch.crates-io]
# Shared ICC recognition used by the pinned JPEG HDR decoder.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
ultrahdr-core = { path = "ultrahdr-core" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f5a7fd46231048a7290f11df5b32e010a3e529a8" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "f5a7fd46231048a7290f11df5b32e010a3e529a8" }
# zenjpeg (a path sibling) depends on `zenanalyze = "0.2.0"` from the registry
# and supplies it through its OWN `[patch.crates-io]`. A dependency's patch
# table is ignored when that dependency is consumed as a path dep — only the
# root workspace's applies — so without this entry every build here fails with
# `failed to select a version for the requirement zenanalyze = "^0.2.0"`
# (crates.io latest is 0.1.0; the 0.2.x line lives on git until it publishes).
# Git rather than path: CI clones some siblings but not zenanalyze. Remove this
# once zenanalyze 0.2.0 is published. Same fix as zenjxl 1ae0da79.
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
