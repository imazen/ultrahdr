[package]
name = "ultrahdr-rs"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
description = "Pure Rust Ultra HDR (JPEG with gain map) encoder/decoder"
keywords = ["hdr", "jpeg", "gainmap", "ultrahdr", "image"]
categories = ["multimedia::images", "encoding"]
readme = "../README.md"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
    "tests/",
]

[dependencies]
# Core gain map math and metadata
ultrahdr-core = { workspace = true }

# Color management
moxcms = { workspace = true }

# Image buffer abstractions
imgref = { workspace = true }
rgb = { workspace = true }
bytemuck = { workspace = true }

# Math (re-exported from core, but needed for container)
wide = { workspace = true }
half = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Error location tracking (At<Error> server-side stack traces), matching
# ultrahdr-core's instrumentation so origins are captured across the boundary.
whereat = "0.1.5"

# Cooperative cancellation
enough = { workspace = true }

# Reference implementation comparison (optional, for FFI parity tests).
# Pinned to the imazen fork of libultrahdr-rs for build-stability
# improvements we haven't tried to upstream yet. Imported as
# `libultrahdr_rs` (hyphen → underscore) to match the fork's repo name
# and leave a clear audit trail in test code.
libultrahdr_rs = { package = "ultrahdr", version = "0.1.3", git = "https://github.com/imazen/libultrahdr-rs.git", rev = "b820575b0029bfe6684c8d14fe66a655016e9c72", optional = true }

[dev-dependencies]
# Testing (WASM-compatible)
fast-ssim2 = { workspace = true }

# WASM testing
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2.110"
wasm-bindgen-test = "0.3.60"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Native-only testing (these don't compile for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
zune-image = "0.5"
zune-core = "0.5"
zune-jpeg = "0.5"
# Real-file parity fixtures (Pixel samples, Google libultrahdr testdata,
# awesome-gain-maps corpus, rejection goldens). Downloaded lazily on
# first run from imazen/codec-corpus; cached in ~/.cache.
codec-corpus = "1.1"
# Pixel-parity tests shell out to `ultrahdr_app`; `which` discovers the
# binary on PATH, `tempfile` manages scratch files for raw-pixel output.
# Both are gated behind the __pixel-parity feature via tests/ cfg attrs.
which = "8.0.2"
tempfile = "3.27.0"

[features]
default = []
simd = ["ultrahdr-core/simd"]  # Enable explicit SIMD optimizations
# Forwarded to ultrahdr-core: adds `Decoder::decode_full_sdr` (HDR→SDR via
# the audited-winner Bt2446A curve + measure_max peak measurement, all in
# one call). See the ultrahdr-core docs for the empirical citation.
# Default-off to keep transitive deps minimal; opt-in for HDR→SDR display
# paths.
tonemap-bt2446a = ["ultrahdr-core/tonemap-bt2446a"]
ffi-tests = ["dep:libultrahdr_rs"]  # FFI parity tests against libultrahdr (C++).
# Pixel-level parity tests against Google's `ultrahdr_app` subprocess. Gated
# because the binary is not available on most developer machines; CI enables
# this in the Gain Map Interop workflow where `ultrahdr_app` is installed.
# The caller (CI) decides whether to run these — no runtime "silent skip".
__pixel-parity = []
zencodec = ["dep:zenpixels"]  # zencodec trait integration (zencodec itself is already unconditional)

[dependencies.zenjpeg]
workspace = true

[dependencies.zencodec]
# Unconditional: zenjpeg already transitively pulls zencodec, and
# ultrahdr-rs uses zencodec::gainmap directly (ISO 21496-1 payload
# + ISO_21496_1_PRIMARY_APP2_BODY). Removing the `optional = true`
# gate drops a useless feature flag, not a transitive-dep edge.
workspace = true

[dependencies.zenpixels]
workspace = true
optional = true

