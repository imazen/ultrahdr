[package]
name = "ultrahdr-rs"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
description = "Pure Rust Ultra HDR (JPEG with gain map) encoder/decoder"
keywords = ["hdr", "jpeg", "gainmap", "ultrahdr", "image"]
categories = ["multimedia::images", "encoding"]
readme = "../README.md"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[dependencies]
# Core gain map math and metadata
ultrahdr-core = { workspace = true }

# Color management
moxcms = { workspace = true }

# Image buffer abstractions
imgref = { workspace = true }
rgb = { workspace = true }
bytemuck = { workspace = true }

# Math (re-exported from core, but needed for container)
wide = { workspace = true }
half = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Cooperative cancellation
enough = { workspace = true }

# Reference implementation comparison (optional, for FFI parity tests)
# Aliased to avoid name conflict with our crate
libultrahdr = { package = "ultrahdr", version = "0.1", optional = true }

[dev-dependencies]
# Testing (WASM-compatible)
fast-ssim2 = { workspace = true }

# WASM testing
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2.110"
wasm-bindgen-test = "0.3.60"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Native-only testing (these don't compile for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
zune-image = "0.5"
zune-core = "0.5"
zune-jpeg = "0.5"

[features]
default = []
simd = ["ultrahdr-core/simd"]  # Enable explicit SIMD optimizations
ffi-tests = ["libultrahdr"]  # Enable FFI parity tests with libultrahdr C++
_test-helpers = ["dep:zenjpeg"]  # Internal: enables test helper methods (underscore prefix = not public API)
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:zenjpeg"]  # zencodec trait integration

[dependencies.zenjpeg]
workspace = true
optional = true

[dependencies.zencodec]
workspace = true
optional = true

[dependencies.zenpixels]
workspace = true
optional = true

